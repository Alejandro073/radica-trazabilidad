{% extends "base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<section class="tarjeta login">
  <h1>Ingresar a Radica</h1>
  <p class="suave">Sistema de trazabilidad digital para la radicación de cuentas médicas.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% if form.errors %}<p class="msg msg-error" role="alert">Usuario o contraseña incorrectos.</p>{% endif %}
    <label for="id_username">Usuario</label>
    <input type="text" name="username" id="id_username" autocomplete="username" autofocus required>
    <label for="id_password">Contraseña</label>
    <input type="password" name="password" id="id_password" autocomplete="current-password" required>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn" type="submit">Ingresar</button>
  </form>
</section>
{% endblock %}
