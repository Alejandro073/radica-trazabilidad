# Blueprint de Render: aplicación Docker + PostgreSQL gratuito (URL pública de pruebas).
# Verifique en render.com los límites vigentes del plan gratuito antes de la sustentación.
databases:
  - name: radica-db
    plan: free
    databaseName: radica
    user: radica

services:
  - type: web
    name: radica
    runtime: docker
    plan: free
    healthCheckPath: /salud/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: radica-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: SEED_DEMO
        value: "1"
      - key: SECURE_COOKIES
        value: "1"
      - key: SSL_REDIRECT
        value: "0"
      - key: DEMO_PASSWORD
        sync: false
